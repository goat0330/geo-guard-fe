server {
    listen 80 http2;
    listen 443 ssl http2;

    server_name localhost;
    client_max_body_size 50m;

    # Compose mounts the built frontend directly at /usr/share/nginx/html.
    root   /usr/share/nginx/html/;

    ssl_certificate     /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m; # 10m 约支持 40000 个会话
    ssl_session_timeout 1d;

    # 基础配置
    sendfile on;
    tcp_nopush on;

    # gzip配置
    gzip on;
    gzip_min_length 32k;        # 小于 32k 的文件没必要压，可能越压越大
    gzip_static on; # 如果目录下有 .gz 后缀的预压缩文件，直接使用
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/rss+xml 
        image/svg+xml 
        font/opentype 
        application/vnd.ms-fontobject;

    

    # 生产环境 - 地图资源（地形、影像）
    location ^~ /MapResource {
        proxy_pass http://localhost:8003;
        # 显式移除可能干扰缓存的响应头
        # 强制忽略后端可能发出的干扰头
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Pragma;
        
        # 强制覆盖为强缓存 7 天，并加上 public
        add_header Cache-Control "public, max-age=604800, no-transform";
    }

    # 音频服务
     location ^~ /audioServer/ {
      proxy_pass http://124.74.245.74:34012/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header REMOTE-HOST $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      # sse 与 websocket参数
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_cache off;
    }

    # geoserver服务
    location ^~ /geoserver/ {
        proxy_pass http://localhost:8004;
        proxy_set_header Host  $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade  $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # oss服务
    location ^~ /oss-service/ {
        proxy_pass http://oss-service:9000/;  # Replace with an authorized OSS service.
        # 基础代理头
        proxy_set_header Host "oss-service:9000";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 大模型图片文件服务
    location ^~ /images-service/ {
        proxy_pass http://model-files-service:8010/;
        proxy_set_header Host  $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade  $http_upgrade;
    }

    location ^~ /files-service/ {
        proxy_pass http://model-files-service:8010/;
        proxy_set_header Host  $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade  $http_upgrade;
    }


    location /api-ws {
      proxy_pass https://124.74.245.74:34024/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header REMOTE-HOST $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      # sse 与 websocket参数
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_cache off;
    }

    # 天地图转发
    location ^~ /t_map/ {
        proxy_pass http://host.docker.internal:15175/;
        proxy_set_header Host t0.tianditu.com; # 请求天地图资源一定要添加这个，否则会报404
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        # sse 与 websocket参数
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    # 生产环境 - API 服务
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        # proxy_ssl_server_name off;
    }

    #管理后台 
    location ^~ /geo-admin/ {
      alias /usr/share/nginx/admin/;
      
      index  index.html index.htm;
      try_files $uri $uri/ /geo-admin/index.html;
    
    }

    # 生产环境 - 静态文件服务
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 1. 静态资源 (JS, CSS, Images, Fonts)
    # 策略：强缓存 7 天
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|ttf|otf|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 2. 入口文件 (HTML)
    # 策略：不走强缓存，走协商缓存 (Etag)
    # 原因：防止版本更新后，用户浏览器还停留在旧版 HTML 导致无法加载新资源
    location ~* \.(?:html|htm)$ {
        add_header Cache-Control "no-cache";
        expires -1;
    }
}
