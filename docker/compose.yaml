services:
  web:
    image: nginx:alpine
    container_name: geo-guard-web
    restart: unless-stopped

    ports:
      # HTTP，用于跳转到 HTTPS
      - '5173:80'

      # HTTPS
      - '5174:443'

    # 让容器通过稳定域名访问宿主机 API
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    volumes:
      # 前端静态文件
      - ../front:/usr/share/nginx/html:ro
      - ../admin:/usr/share/nginx/admin:ro

      # Nginx 配置
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # SSL 证书
      - ./nginx/ssl:/etc/nginx/ssl:ro

    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q --spider https://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
